# Lom CI — 三平台构建 + 全量回归（Phase 6.3）
#
# 每个 push/PR 在 Linux / macOS / Windows 上跑：
#   1. cargo test --release（Rust 单元测试）
#   2. 自举回归（stmt_interp.lom 全量输出非空且无异常退出）
#   3. eval 参考解验证（三平台统一 run.ps1 + pwsh；macOS 自带 bash 3.2 跑不动 run.sh 的关联数组）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Bootstrap regression (stmt_interp, golden 逐字比对)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=./target/release/lom.exe; else BIN=./target/release/lom; fi
          # golden 文件逐字比对（39 条输出；行数防线太弱——内容错乱但行数不变的回归也要抓到）
          # tr -d '\r'：Windows 检出可能带 CRLF（autocrlf），比对前统一去 CR
          $BIN examples/bootstrap/stmt_interp.lom > /tmp/stmt_actual.txt
          diff <(tr -d '\r' < examples/bootstrap/stmt_interp.expected.txt) <(tr -d '\r' < /tmp/stmt_actual.txt)

      - name: Zero-dependency gate
        # SECURITY.md 承诺：Cargo.toml 引入任何依赖即构建失败（零依赖是永久设计决策，例外需 RFC）
        # 只扫描 [dependencies] section 内、非注释非空白的条目行（跨 section 即停）
        shell: bash
        run: |
          # 覆盖 [dependencies] 与 [dependencies.foo] 表形态（TOML 合法写法都拦）
          if awk '/^\[(dev-|build-)?dependencies(\..*)?\]/{f=1;next} /^\[/{f=0} f && /^[a-zA-Z0-9_-]+ *=/{found=1; print "  found dependency: " $0} END{exit found}' Cargo.toml; then
            echo "zero-dependency gate: OK"
          else
            echo "ERROR: Cargo.toml [dependencies] 非空——零依赖政策被破坏（例外需 RFC）"; exit 1
          fi

      - name: lom fmt gate
        # 全部示例必须是 fmt 幂等的（apply_test.lom 是故意坏文件，豁免）
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { "./target/release/lom.exe" } else { "./target/release/lom" }
          $bad = @()
          Get-ChildItem -Recurse examples -Filter *.lom | Where-Object { $_.Name -ne "apply_test.lom" } | ForEach-Object {
            & $bin fmt $_.FullName --check | Out-Null
            if ($LASTEXITCODE -ne 0) { $bad += $_.FullName }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Error "未格式化: $_" }; exit 1 }
          Write-Output "fmt gate: all examples canonical"

      - name: Eval verify (all platforms)
        # 统一走 PowerShell runner：macOS 自带 bash 3.2 而 run.sh 用了 bash4 关联数组；
        # pwsh 在 GitHub 三平台 runner 均预装，run.ps1 是一等维护对象
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { "./target/release/lom.exe" } else { "./target/release/lom" }
          ./eval/runner/run.ps1 -Verify -LomBin $bin

      - name: WASM eval parity (116 tasks via node, Phase 7.9)
        # 双后端对齐 gate：eval 全套在 WASM 后端跑一遍（node 在三平台 runner 均预装）
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { "./target/release/lom.exe" } else { "./target/release/lom" }
          ./eval/runner/run.ps1 -Verify -LomBin $bin -Backend wasm

      - name: WASM bootstrap golden (stmt_interp 逐字比对, Phase 7.9)
        # 自举程序编译到 WASM 后与 golden 逐字比对；产物放工作目录而非 /tmp（Windows 上 Git Bash 的 /tmp 对 node.exe 不可见）
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=./target/release/lom.exe; else BIN=./target/release/lom; fi
          $BIN build examples/bootstrap/stmt_interp.lom --target wasm -o _ci_stmt_interp.wasm
          node eval/runner/run_wasm.mjs _ci_stmt_interp.wasm > _ci_stmt_wasm.txt
          diff <(tr -d '\r' < examples/bootstrap/stmt_interp.expected.txt) <(tr -d '\r' < _ci_stmt_wasm.txt)
          rm -f _ci_stmt_interp.wasm _ci_stmt_wasm.txt

  # Phase 8.4（RFC-0003 修订 20-24）：自举验收 CI gate——稳定模式（8.1 dump/tokens/diags + 8.2 static + 8.3 run）
  # wasm 层（--wasm）因未定位的非确定性越界不接（会随机红，详见 RFC 修订 21）
  # 只跑 ubuntu（自举验收与平台无关；CRLF 场景由其他 gate 覆盖）
  selfhost:
    name: selfhost verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Selfhost dump (147 文件逐字, Phase 8.1)
        run: python3 tools/verify_selfhost.py
      - name: Selfhost tokens (Phase 8.1 lexer 对账)
        run: python3 tools/verify_selfhost.py --tokens
      - name: Selfhost diags (Phase 8.1 诊断对齐)
        run: python3 tools/verify_selfhost.py --diags
      - name: Selfhost static (Phase 8.2 四类检查)
        run: python3 tools/verify_selfhost.py --static
      - name: Selfhost run (8.3 运行验收 + json 双内建, v0.27.0)
        run: python3 tools/verify_selfhost.py --run

  # 第四轮评审整改（2026-08-31）：clippy 存量清零后转 gate（只跑 ubuntu，风格 lint 与平台无关）
  # 注意：clippy 随 stable 演进，未来新版新增 lint 可能让旧代码报错——届时修掉或按需 allow，别降 gate
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (deny warnings)
        run: cargo clippy --release -- -D warnings
