# Lom CI — 三平台构建 + 全量回归（Phase 6.3）
#
# 每个 push/PR 在 Linux / macOS / Windows 上跑：
#   1. cargo test --release（Rust 单元测试）
#   2. 自举回归（stmt_interp.lom 全量输出非空且无异常退出）
#   3. eval 参考解验证（三平台统一 run.ps1 + pwsh；macOS 自带 bash 3.2 跑不动 run.sh 的关联数组）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Build (release)
        # 注意：Cargo.lock 按仓库惯例不入库（gitignore），且零依赖，无需 --locked
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Bootstrap regression (stmt_interp, golden 逐字比对)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=./target/release/lom.exe; else BIN=./target/release/lom; fi
          # golden 文件逐字比对（39 条输出；行数防线太弱——内容错乱但行数不变的回归也要抓到）
          # tr -d '\r'：Windows 检出可能带 CRLF（autocrlf），比对前统一去 CR
          $BIN examples/bootstrap/stmt_interp.lom > /tmp/stmt_actual.txt
          diff <(tr -d '\r' < examples/bootstrap/stmt_interp.expected.txt) <(tr -d '\r' < /tmp/stmt_actual.txt)

      - name: Zero-dependency gate
        # SECURITY.md 承诺：Cargo.toml 引入任何依赖即构建失败（零依赖是永久设计决策，例外需 RFC）
        shell: bash
        run: |
          if grep -A5 '^\[dependencies\]' Cargo.toml | grep -E '^[a-zA-Z_]'; then
            echo "ERROR: Cargo.toml [dependencies] 非空——零依赖政策被破坏（例外需 RFC）"; exit 1
          fi
          echo "zero-dependency gate: OK"

      - name: lom fmt gate
        # 全部示例必须是 fmt 幂等的（apply_test.lom 是故意坏文件，豁免）
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { "./target/release/lom.exe" } else { "./target/release/lom" }
          $bad = @()
          Get-ChildItem -Recurse examples -Filter *.lom | Where-Object { $_.Name -ne "apply_test.lom" } | ForEach-Object {
            & $bin fmt $_.FullName --check | Out-Null
            if ($LASTEXITCODE -ne 0) { $bad += $_.FullName }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Error "未格式化: $_" }; exit 1 }
          Write-Output "fmt gate: all examples canonical"

      - name: Eval verify (all platforms)
        # 统一走 PowerShell runner：macOS 自带 bash 3.2 而 run.sh 用了 bash4 关联数组；
        # pwsh 在 GitHub 三平台 runner 均预装，run.ps1 是一等维护对象
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { "./target/release/lom.exe" } else { "./target/release/lom" }
          ./eval/runner/run.ps1 -Verify -LomBin $bin
