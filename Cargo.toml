[package]
name = "lom"
version = "1.9.5"
edition = "2024"
description = "Lom (Language of Machine) — an AI-native programming language: LLM-repair-native toolchain (lom fix), progressive typing, explicit effects, self-hosting-verified."
license = "Apache-2.0"
repository = "https://github.com/lom-lang/lom"
homepage = "https://github.com/lom-lang/lom"
keywords = ["ai-native", "programming-language", "llm", "interpreter", "wasm"]

[dependencies]
# 永久零依赖（设计决策，非临时状态）：手写 lexer/parser/interpreter/JSON，
# 供应链攻击面为零，构建可复现。历史上曾计划引入 logos/thiserror/miette，均未采用。

[profile.release]
debug = true  # keep debug info for easier debugging of the interpreter itself

# playground（designs/0019）：wasm 构建专用 profile——release 的 debug=true
# 会把调试信息带进 wasm 产物显著膨胀；仅 --profile wasm-release 使用，
# 桌面 release 路径零影响。
[profile.wasm-release]
inherits = "release"
debug = false
